<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德州扑克 · 练习器</title>
<style>
  /* ================= 主题变量 ================= */
  :root {
    --bg1: #16241e; --bg2: #08100c;
    --felt-a: #1d6b47; --felt-b: #0f3f2b; --felt-c: #0a2b1e;
    --rim: #2a1a12;
    --text: #e8efe9; --text-dim: #9fb3a8; --text-soft: #cfe0d6;
    --gold: #ffd479; --accent: #2f7a58; --accent-2: #3f9b6f;
    --panel: rgba(0,0,0,.35); --line: rgba(255,255,255,.07);
    --win: #7ee2a8; --lose: #e08a8a;
    --card-back-a: #24463a; --card-back-b: #1c3a30;
  }
  body[data-theme="blue"] {
    --bg1: #101a2c; --bg2: #070b14;
    --felt-a: #1b4f7a; --felt-b: #0f3156; --felt-c: #0a2340;
    --rim: #17222f;
    --accent: #2f6a9a; --accent-2: #3f86b8;
    --card-back-a: #23405e; --card-back-b: #1b3349;
  }
  body[data-theme="wood"] {
    --bg1: #2a1d12; --bg2: #120c07;
    --felt-a: #2f6b3a; --felt-b: #24512e; --felt-c: #16341f;
    --rim: #4a2c18;
    --gold: #f0c060; --accent: #b8752f; --accent-2: #d08c42;
    --card-back-a: #5a3f26; --card-back-b: #48301c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg1), var(--bg2) 70%);
    color: var(--text);
    min-width: 1280px;
    overflow: hidden;
    user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    padding: 10px 20px;
    background: rgba(0,0,0,.35);
    border-bottom: 1px solid rgba(255,255,255,.07);
    font-size: 13px;
  }
  .topbar .brand { font-weight: 700; color: var(--gold); letter-spacing: 1px; }
  .topbar .stat { color: var(--text-dim); flex-shrink: 0; }
  .topbar .brand, .topbar .seg, .topbar .btn-mini { flex-shrink: 0; }
  .topbar .stat b { color: var(--text); font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .topbar .btn-mini {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
    color: var(--text-soft); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .topbar .btn-mini:hover { background: rgba(255,255,255,.15); }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; overflow: hidden; }
  .seg button {
    background: transparent; border: 0; color: #8fa79a; font-size: 12px;
    padding: 4px 11px; cursor: pointer; font-family: inherit;
  }
  .seg button:hover { color: var(--text-soft); }
  .seg button.on { background: var(--accent); color: #eafff3; }
  .ai-level select {
    background: #16241d; color: var(--text-soft); border: 1px solid rgba(255,255,255,.16);
    border-radius: 6px; padding: 3px 6px; font-size: 12px; font-family: inherit;
    cursor: pointer; outline: none;
  }
  .msg-toggle { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .msg-toggle input { accent-color: #2f7a58; cursor: pointer; margin: 0; }
  .theme-pick { display: inline-flex; gap: 6px; }
  .theme-btn {
    background: rgba(255,255,255,.07); border: 1px solid var(--line);
    color: var(--text-soft); padding: 4px 10px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .theme-btn:hover { background: rgba(255,255,255,.14); }
  .theme-btn.on { background: var(--accent); color: #fff; border-color: transparent; }
  #setMusicVol, #setSfxVol { width: 140px; accent-color: var(--accent); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .table-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .table {
    position: relative; width: 900px; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 0;
  }
  .felt {
    position: absolute; inset: 40px 40px;
    background: radial-gradient(ellipse at 50% 45%, var(--felt-a), var(--felt-b) 70%, var(--felt-c));
    border-radius: 240px;
    border: 10px solid var(--rim);
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), 0 14px 40px rgba(0,0,0,.6);
  }

  /* ---------- 座位 ---------- */
  .seats { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .seat {
    position: absolute; width: 150px; text-align: center;
    transform: translate(-50%, -50%);
    transition: left .35s ease, top .35s ease, opacity .2s;
    pointer-events: auto;
  }
  .seat.me { width: 230px; }
  .seat .avatar-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .seat.me .avatar-row { margin-top: 8px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: #1b2b23; border: 2px solid #35594a;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; transition: border-color .2s, box-shadow .2s; flex: none;
  }
  .seat.me .avatar { width: 52px; height: 52px; font-size: 26px; }
  .avatar.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,212,121,.25); }
  .avatar.out { filter: grayscale(1) brightness(.55); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  .avatar.mine { cursor: pointer; }
  .avatar.mine:hover { border-color: var(--gold); }
  .seat .who { font-size: 12px; color: var(--text-soft); text-align: left; }
  .seat .chips { font-size: 14px; font-weight: 700; color: var(--gold); margin-top: 1px; text-align: left; }
  .seat .style-tag { display: none; font-size: 10px; line-height: 15px; padding: 0 5px; margin-top: 2px; border-radius: 4px; background: rgba(120, 200, 255, .16); color: #8fd4ff; text-align: left; width: fit-content; }
  .seat.me .who { font-size: 13px; }
  .seat.me .chips { font-size: 15px; }
  .seat .pos-tag {
    display: inline-block; font-size: 11px; color: var(--text-dim);
    border: 1px solid rgba(255,255,255,.15); border-radius: 4px; padding: 0 5px; margin-left: 4px;
  }
  .seat .folded-mark { font-size: 11px; color: #8a9a92; margin-top: 2px; }
  .seat .bubble {
    position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    background: #f4f1e8; color: #23302a; font-size: 12px; line-height: 1.3;
    padding: 5px 10px; border-radius: 10px; white-space: nowrap;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 5;
  }
  .bubble::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #f4f1e8; border-bottom: 0;
  }
  .bubble.show { opacity: 1; }
  .seat .bet-pill {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -14px;
    background: rgba(255,212,121,.15); border: 1px solid rgba(255,212,121,.4);
    color: var(--gold); font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap;
  }
  .dealer-btn {
    position: absolute; left: -10px; top: 30px; width: 22px; height: 22px; border-radius: 50%;
    background: #f4f1e8; color: #1a1a1a; font-size: 11px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .status-tag {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px;
    font-size: 12px; color: #7f9489;
  }

  /* ---------- 中央 ---------- */
  .center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .pot-box {
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,212,121,.25);
    border-radius: 20px; padding: 4px 18px; font-size: 14px; color: var(--gold);
  }
  .pot-box b { font-size: 18px; }
  .board { display: flex; gap: 8px; min-height: 78px; align-items: center; }
  .street-label { font-size: 12px; color: #7f9489; letter-spacing: 2px; }

  /* ---------- 卡牌 ---------- */
  .card {
    width: 52px; height: 74px; border-radius: 7px; background: #fbfaf5;
    color: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.45); position: relative;
    transition: transform .15s;
  }
  .card .rk { font-size: 22px; line-height: 1; }
  .card .su { font-size: 20px; line-height: 1.1; }
  .card.red { color: #c0392b; }
  .card.small { width: 38px; height: 54px; }
  .card.small .rk { font-size: 16px; }
  .card.small .su { font-size: 15px; }
  .card.back {
    background: repeating-linear-gradient(45deg, var(--card-back-a), var(--card-back-a) 6px, var(--card-back-b) 6px, var(--card-back-b) 12px);
    color: transparent;
  }
  .card.empty { background: transparent; box-shadow: none; border: 1px dashed rgba(255,255,255,.12); }
  .hole-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }

  /* ---------- 右侧信息 ---------- */
  .info {
    width: 250px; background: rgba(0,0,0,.3);
    border-left: 1px solid rgba(255,255,255,.07);
    display: flex; flex-direction: column; min-height: 0;
  }
  .info-section { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .info-section h4 { font-size: 12px; color: #7f9489; font-weight: 500; margin-bottom: 8px; letter-spacing: 1px; }
  .info-row { display: flex; justify-content: space-between; padding: 3px 0; color: var(--text-soft); }
  .info-row b { color: var(--gold); }
  .hand-tip { font-size: 12px; color: var(--text-dim); line-height: 1.65; }
  .log {
    flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.6; color: var(--text-dim);
  }
  .log .l { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.03); }
  .log .l b { color: var(--text-soft); }
  .log .l.street-mark { color: var(--gold); margin-top: 6px; }

  /* ---------- 底栏 ---------- */
  .actionbar {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: rgba(0,0,0,.4); border-top: 1px solid rgba(255,255,255,.07);
    min-height: 76px;
  }
  .actionbar .hint { color: #7f9489; font-size: 13px; min-width: 240px; }
  .actionbuttons { display: flex; gap: 10px; flex: 1; }
  .btn {
    border: none; border-radius: 9px; padding: 12px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: filter .15s, transform .05s; color: #10201a;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.fold { background: #7a4a4a; color: #f3e6e6; }
  .btn.check { background: #4a7a63; color: #e9f5ef; }
  .btn.call { background: #4a7a63; color: #e9f5ef; }
  .btn.raise { background: #d9a641; }
  .btn.allin { background: #c0392b; color: #fbe9e7; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .raise-panel { display: flex; align-items: center; gap: 10px; }
  .raise-panel input[type=range] { width: 180px; accent-color: #d9a641; }
  .raise-panel .amt { font-weight: 700; color: var(--gold); min-width: 70px; text-align: center; }
  .odds-hint { font-size: 12px; color: var(--text-dim); max-width: 260px; }

  /* ---------- 弹层 ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #14211b; border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 22px 26px; width: 560px; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
  }
  .modal h3 { font-size: 17px; color: var(--gold); margin-bottom: 14px; }
  .modal.wide { width: 760px; max-width: 94vw; }
  .gto-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .gto-bar select { background: #1d2f27; color: #dbe7df; border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 100%; }
  .gto-note { font-size: 11px; color: #7f9489; }
  .gto-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; }
  .gto-cell { aspect-ratio: 1 / 1; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .gto-cell b { font-size: 10px; color: #fff; font-weight: 700; line-height: 1.1; }
  .gto-cell i { font-style: normal; font-size: 8px; color: rgba(255,255,255,.82); line-height: 1.1; }
  .modal { animation: popIn .22s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to { opacity: 1; transform: none; }
  }
  .modal .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .modal .row .win { color: #6fcf97; font-weight: 700; }
  .modal .row .lose { color: #eb5757; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal .actions .btn { padding: 9px 18px; font-size: 14px; }
  .modal .note { font-size: 12px; color: #7f9489; line-height: 1.7; margin-top: 10px; }
  .modal .ai-guide { padding: 10px 12px; background: rgba(255,255,255,.03); border-left: 2px solid #3d6b52; border-radius: 4px; }
  .modal .ai-guide b { color: #d8b862; }
  #setAi { width: 176px; }
  .modal .hand-line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .modal .hand-line .mini-cards { display: flex; gap: 4px; }
  .modal .empty-tip { color: #7f9489; font-size: 13px; padding: 20px 0; text-align: center; }
  .modal .replay-line {
    display: flex; gap: 8px; align-items: baseline; font-size: 12px;
    padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .modal .replay-line .rp-street { color: #7f9489; width: 42px; flex: none; }
  .modal .replay-line .rp-who {
    color: var(--text-soft); width: 92px; flex: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .modal .replay-line .rp-act { color: var(--gold); flex: 1; }
  .modal .replay-line .rp-pot { color: #7f9489; flex: none; }
  .modal .replay-board {
    font-size: 12px; color: var(--text-dim); padding: 6px 0 4px;
    letter-spacing: 1px; border-top: 1px dashed rgba(255,255,255,.06); margin-top: 4px;
  }
  .modal .replay-ctrl { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .modal .replay-ctrl .btn { padding: 4px 10px; font-size: 12px; }
  .modal .rv-step { margin-left: auto; font-size: 12px; color: #7f9489; }
  .modal .replay-pots {
    display: flex; flex-wrap: wrap; gap: 6px 14px;
    font-size: 12px; color: var(--text-dim); padding: 4px 0 8px;
  }
  .modal .replay-pots .rv-pot-item.now { color: var(--gold); }
  .modal .replay-pots .rv-pot-item.now b { color: var(--gold); }
  .modal .replay-pots b { color: var(--text-soft); font-weight: 700; }
  .modal .replay-list { max-height: 200px; overflow-y: auto; }
  .modal .replay-line.now { background: rgba(255,212,121,.10); }
  .modal .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
  .modal .stat-cell { background: rgba(255,255,255,.03); border-radius: 8px; padding: 10px 12px; }
  .modal .sc-label { font-size: 12px; color: #7f9489; }
  .modal .sc-value { font-size: 20px; font-weight: 700; color: var(--gold); margin: 2px 0; }
  .modal .sc-tip { font-size: 11px; color: #6f8479; }
  .modal .curve {
    display: block; width: 100%; height: auto;
    background: rgba(255,255,255,.02); border-radius: 8px;
  }
  .modal .note-box {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 60px;
    background: rgba(0,0,0,.28); color: var(--text-soft); border: 1px solid rgba(255,255,255,.12);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6;
    font-family: inherit;
  }
  .modal .note-box:focus { outline: none; border-color: var(--gold); }
  .modal .num-input {
    width: 90px; text-align: right; font-size: 14px;
    background: rgba(0,0,0,.28); color: var(--gold); border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px; padding: 4px 8px; font-family: inherit;
  }
  .modal .num-input:focus { outline: none; border-color: var(--gold); }
  .modal .avatar-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 8px 0;
  }
  .modal .avatar-pick {
    font-size: 26px; line-height: 1; padding: 10px 0; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px; font-family: inherit;
  }
  .modal .avatar-pick:hover { border-color: var(--gold); background: rgba(255,212,121,.10); }
  .modal .more-list { display: flex; flex-direction: column; gap: 8px; }
  .modal .more-item {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10);
    color: var(--text-soft); padding: 14px 16px; border-radius: 10px; font-size: 15px;
    font-family: inherit; cursor: pointer; text-align: left;
  }
  .modal .more-item:hover { background: rgba(255,255,255,.12); }
  .modal .review-title {
    margin: 14px 0 8px; font-weight: 700; color: var(--gold); font-size: 13px;
    border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px;
  }
  .modal .review-item {
    border-left: 3px solid #556; padding: 6px 10px; margin-bottom: 6px;
    background: rgba(255,255,255,.03); border-radius: 0 6px 6px 0;
  }
  .modal .review-item.good { border-left-color: #4caf7d; }
  .modal .review-item.ok { border-left-color: #8c9a92; }
  .modal .review-item.mistake { border-left-color: #d0685a; }
  .modal .review-item .rv-tag {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: rgba(255,255,255,.08); margin-right: 6px; color: var(--text-soft);
  }
  .modal .review-item.good .rv-tag { color: #7fe0a8; }
  .modal .review-item.mistake .rv-tag { color: #ff9a8a; }
  .modal .review-item .rv-text { font-size: 13px; color: #dbe7df; line-height: 1.5; margin-top: 3px; }
  .modal .review-item .rv-assume { font-size: 11px; color: #7f9489; margin-top: 3px; }
  .modal .rv-jump {
    margin-left: 6px; padding: 1px 8px; font-size: 11px; cursor: pointer;
    background: rgba(255,212,121,.12); color: var(--gold);
    border: 1px solid rgba(255,212,121,.35); border-radius: 10px;
    font-family: inherit;
  }
  .modal .rv-jump:hover { background: rgba(255,212,121,.22); }
  .modal .guide-tabs { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
  .modal .guide-tab {
    padding: 5px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid transparent;
    color: var(--text-dim); font-family: inherit;
  }
  .modal .guide-tab.on {
    background: rgba(255,212,121,.14); border-color: rgba(255,212,121,.4); color: var(--gold);
  }
  .modal .guide-body { font-size: 13px; line-height: 1.8; color: var(--text-soft); }
  .modal .guide-body p { margin: 6px 0; }
  .modal .guide-body h4 {
    margin: 16px 0 6px; color: var(--gold); font-size: 14px; font-weight: 700;
  }
  .modal .guide-body h4:first-child { margin-top: 0; }
  .modal .guide-step { display: flex; gap: 10px; margin: 8px 0; align-items: flex-start; }
  .modal .guide-num {
    flex: none; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px;
    background: rgba(255,212,121,.16); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .modal .hand-rank-row {
    display: flex; align-items: center; gap: 12px; padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .modal .hand-rank-name { width: 76px; flex: none; font-size: 13px; color: var(--gold); }
  .modal .hand-rank-cards { display: flex; gap: 4px; flex: none; }
  .modal .hand-rank-tip { font-size: 12px; color: var(--text-dim); }
  .modal .term-row {
    display: flex; gap: 12px; padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .modal .term-name { width: 84px; flex: none; color: var(--gold); font-size: 13px; }

  @media (max-width: 720px) {

  /* ---------- 手机竖屏适配（≤899px） ---------- */
  @media (max-width: 899px) {

    .seat.me .avatar { width: 38px; height: 38px; font-size: 19px; }
    .seat .who { font-size: 10px; }
    .seat .chips { font-size: 11px; }
    .seat.me .who { font-size: 11px; }
    .seat.me .chips { font-size: 12px; }
    .seat .pos-tag { font-size: 9px; padding: 0 3px; margin-left: 2px; }
    .seat .folded-mark { font-size: 9px; }
    .seat .bet-pill { font-size: 10px; padding: 0 6px; bottom: -11px; }
    .seat .bubble { font-size: 10px; padding: 3px 7px; max-width: 112px; white-space: normal; line-height: 1.3; }
    .dealer-btn { width: 15px; height: 15px; font-size: 8px; left: auto; right: 0; top: 0; }

    /* 中央 */
    .center { gap: 6px; }
    .pot-box { font-size: 12px; padding: 3px 12px; }
  .pot-box.bump { animation: potBump .25s ease-out; }
  @keyframes potBump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.13); }
    100% { transform: scale(1); }
  }
    .pot-box b { font-size: 15px; }
    .board { gap: 4px; min-height: 58px; }
    .card { width: 40px; height: 56px; border-radius: 5px; }

    .card .su { font-size: 15px; }

    .card.small .su { font-size: 11px; }

    /* 信息栏 → 底部抽屉 */
    .info {
      position: fixed; left: 0; right: 0; bottom: 0; width: auto; z-index: 45;
      max-height: 64vh; border-left: 0; border-top: 1px solid rgba(255,255,255,.14);
      border-radius: 16px 16px 0 0; background: #0e1813;
      transform: translateY(105%); transition: transform .25s ease;
      box-shadow: 0 -12px 40px rgba(0,0,0,.65);
    }
    .info.open { transform: translateY(0); }
    .info-close {
      padding: 10px; text-align: center; font-size: 13px; color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .info .log { max-height: 26vh; }

    /* 底栏 */
    .actionbar {
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      gap: 6px; min-height: 0;
    }
    .actionbar .hint, .actionbar .odds-hint { display: none; }
    .actionbuttons { gap: 6px; flex-wrap: wrap; min-width: 0; }
    .actionbuttons .btn { flex: 1 1 0; min-width: 0; order: 0; }

    .actionbuttons .raise-panel { flex: 1 1 100%; order: 9; }
    .actionbar .btn {
      padding: 13px 4px; font-size: 13px; min-height: 46px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .raise-panel { gap: 8px; }
    .raise-panel input[type=range] { width: 56%; }
    .raise-panel .amt { min-width: 54px; }
    .info-btn { flex: none; min-width: 52px; min-height: 46px; }

    /* 弹层 */
    .modal {
      width: calc(100vw - 20px); max-height: 88vh;
      padding: 16px 14px; border-radius: 12px;
    }
    .modal h3 { font-size: 16px; margin-bottom: 10px; }

    .modal .replay-line .rp-who { width: 64px; }

    .ch-card { padding: 10px 12px; }
    .ch-result .ch-act { flex-direction: column; }

    .guide-tip, .guide-bar {

    .guide-bar .guide-step { flex: 1 !important; }

  /* ---------------- 挑战模式 ---------------- */
  .ch-status { color: var(--gold); }

  .ch-card .ch-name { font-size: 16px; font-weight: 700; color: var(--gold); }
  .ch-card .ch-desc { font-size: 13px; color: var(--text-dim); }
  .ch-card .ch-best { font-size: 12px; color: var(--accent); }
  .ch-card .ch-go { align-self: flex-end; margin-top: 6px; white-space: nowrap; }
  .ch-card .ch-go, .ch-result .btn { white-space: nowrap; }
  .ch-result { border-radius: 10px; padding: 14px; margin: 12px 0; text-align: center; }
  .ch-result.win { background: rgba(212,175,55,.12); border: 1px solid var(--gold); }
  .ch-result.lose { background: rgba(200,60,60,.10); border: 1px solid var(--lose); }
  .ch-result .ch-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .ch-result.win .ch-title { color: var(--gold); }
  .ch-result.lose .ch-title { color: var(--lose); }
  .ch-result .ch-sub { font-size: 13px; color: var(--text-dim); margin: 2px 0; }
  .ch-result .ch-act { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }

  /* 等级与成就 */
  .toast {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%);
    background: rgba(20,28,24,.97); border: 1px solid var(--gold); color: var(--gold);
    padding: 8px 18px; border-radius: 20px; font-size: 13px; z-index: 80;
    animation: toastIn .3s ease both; pointer-events: none;
  }
  .toast.out { opacity: 0; transition: opacity .6s; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } }
  .ach-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 4px; }
  .ach { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .ach.on { border-color: var(--gold); background: rgba(212,175,55,.07); }
  .ach-name { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .ach.on .ach-name { color: var(--gold); }
  .ach-desc { font-size: 11px; color: var(--text-soft); line-height: 1.35; }

  /* 新手引导 */
  .guide-tip, .guide-bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 104px; z-index: 60;
    background: rgba(18,26,22,.97); border: 1px solid var(--accent);
    border-radius: 12px; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    max-width: min(720px, calc(100vw - 40px));
    font-size: 13px; line-height: 1.5; box-shadow: 0 10px 34px rgba(0,0,0,.55);
  }
  .guide-bar { bottom: 104px; border-color: var(--gold); }
  .guide-bar #guideText { flex: 1; }
  .guide-bar .guide-step { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .guide-tip .btn, .guide-bar .btn { padding: 8px 16px; font-size: 13px; white-space: nowrap; }
  .guide-tip .btn-mini, .guide-bar .btn-mini { white-space: nowrap; }

  /* 大赢庆祝 */
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, .55); }
    55% { box-shadow: 0 0 0 7px rgba(212, 175, 55, 0); }
  }
  #btnChallenge.pulse { animation: btnPulse 2.4s ease-in-out infinite; color: var(--gold); }

  .streak-pop {
    position: fixed; left: 50%; top: 17%; transform: translateX(-50%);
    padding: 8px 18px; border-radius: 999px; font-size: 15px; font-weight: 700;
    z-index: 88; pointer-events: none; animation: streakPop 2.4s ease-out forwards;
    white-space: nowrap;
  }
  .streak-pop.good { background: rgba(212, 175, 55, .18); border: 1px solid var(--gold); color: var(--gold); }
  .streak-pop.bad { background: rgba(200, 60, 60, .15); border: 1px solid var(--lose); color: #ff9a9a; }
  @keyframes streakPop {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(.92); }
    12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    82% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -12px); }
  }

  .badbeat-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 90;
    background: radial-gradient(circle at 50% 42%, rgba(200, 36, 36, .38), rgba(120, 12, 12, .10) 55%, transparent 72%);
    animation: bbFlash .95s ease-out forwards;
  }
  @keyframes bbFlash {
    0% { opacity: 0; }
    12% { opacity: 1; }
    100% { opacity: 0; }
  }
  .badbeat-note {
    margin-top: 10px; padding: 9px 12px; border-radius: 8px;
    background: rgba(200, 36, 36, .12); border: 1px solid rgba(220, 80, 80, .45);
    color: #ffb4b4; font-size: 13px; line-height: 1.5;
  }
  .badbeat-note b { color: #ff8f8f; }

  .big-win {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: 64px; font-weight: 900; color: var(--gold);
    text-shadow: 0 4px 28px rgba(0,0,0,.65);
    pointer-events: none; z-index: 9999;
    animation: bigWin 1.5s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes bigWin {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    35%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -92%) scale(.92); }
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(2px, -1px); }
  }
  body.shake { animation: shake .38s ease-in-out; }

  /* 手机横屏：只求能玩，不求精致 */
  /* ---------------- 手机横屏专用布局（844×390 基准） ---------------- */
  @media (max-width: 980px) and (orientation: landscape) and (max-height: 520px) {
    .app { padding: 0; }
    .topbar { height: 36px; padding: 0 8px; gap: 8px; min-height: 0; }
    .topbar .brand { font-size: 13px; }
    .table-wrap { padding: 2px 6px; }

    /* 牌桌：横向铺满，椭圆压扁 */
    .table { border-radius: 120px; }
    .center { transform: translateY(-14%); gap: 3px; }
    .street-label { display: block; font-size: 10px; margin-top: 1px; }

    /* 座位：更小、更贴边 */
    .seat { width: 70px; }
    .seat.me { width: 100px; }
    .avatar { width: 24px; height: 24px; font-size: 12px; }
    .seat.me .avatar { width: 28px; height: 28px; font-size: 14px; }
    .seat .who { font-size: 9px; }
    .seat .chips { font-size: 10px; }
    .seat .bubble { font-size: 9px; padding: 2px 6px; max-width: 92px; }
    .bet-pill { font-size: 9px; padding: 1px 6px; }
    .dealer-btn { width: 13px; height: 13px; font-size: 7px; }

    /* 牌 */
    .card { width: 32px; height: 45px; }
    .card .rk { font-size: 13px; }
    .card .su { font-size: 11px; }
    .board { min-height: 45px; gap: 4px; }
    .pot-box { padding: 2px 10px; font-size: 11px; }
    .pot-box b { font-size: 13px; }

    /* 别人的下注筹码贴右侧，避免和底池撞 */
    .seat:not(.me) .bet-pill {
      left: calc(100% - 2px); top: 50%; transform: translateY(-50%);
    }
    .dealer-btn { left: 0; right: auto; }

    /* 玩家手牌：贴座位右侧，别挡牌桌中心 */
    .seat.me .hole-row {
      position: absolute; left: calc(100% + 2px); top: 50%;
      transform: translateY(-50%); margin: 0;
    }

    /* 底栏压缩 */
    .actionbar {
      padding: 3px 8px calc(3px + env(safe-area-inset-bottom));
      gap: 6px; min-height: 0;
    }
    .actionbar .btn { min-height: 36px; padding: 6px 4px; font-size: 12px; }
    .raise-panel { gap: 6px; }
    .raise-panel input[type=range] { width: 46%; }
    .info-btn { min-height: 36px; font-size: 12px; padding: 0 10px; }

    /* 信息栏 → 右侧抽屉 */
    .info {
      position: fixed; right: 0; top: 36px; bottom: 76px; left: auto;
      width: 216px; max-height: none; z-index: 55;
      border-left: 1px solid rgba(255,255,255,.14); border-top: 0;
      border-radius: 0; background: #0e1813;
      transform: translateX(102%); transition: transform .25s ease;
      box-shadow: -10px 0 32px rgba(0,0,0,.6);
      overflow-y: auto;
    }
    .info.open { transform: translateX(0); }
    .info-close {
      position: sticky; top: 0; z-index: 2; background: #0e1813;
      padding: 8px; text-align: center; font-size: 12px; color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .info .log { max-height: none; }

    /* 引导条：横屏压成一行 */
    .guide-tip, .guide-bar {
      left: 10px !important; right: 10px !important; bottom: 74px !important;
      transform: none !important; flex-wrap: nowrap !important;
      padding: 6px 10px !important; font-size: 11px !important; gap: 8px !important;
      max-width: none !important;
    }
    .guide-bar #guideText, .guide-tip span {
      flex: 1 1 auto !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .guide-tip .btn, .guide-bar .btn { padding: 5px 10px !important; font-size: 11px !important; }

    /* 弹层留出边距 */
    .modal { max-height: 90vh; }
  }
</style>

<body>
<div class="app">
  <header class="topbar">
    <span class="brand" id="brand">🐋 <span class="brand-text">德州扑克 · 6 人桌</span></span>
    <div class="seg" id="modeSeg">
      <button data-mode="six" class="on">6 人桌</button>
      <button data-mode="nine">9 人桌</button>
    </div>
    <span class="stat">盲注 <b id="topBlinds">10 / 20</b></span>
    <span class="stat">筹码 <b id="topChips">2000</b></span>
    <span class="stat">手数 <b id="topHands">0</b></span>
    <span class="stat">补码 <b id="topRebuys">0</b></span>
    <span class="stat ch-status" id="chStatus" style="display:none"></span>
    <label class="stat ai-level">AI <select id="aiLevelSel">
      <option value="easy">新手</option>
      <option value="normal">熟练</option>
      <option value="hard">职业</option>
    </select></label>
    <label class="stat msg-toggle"><input type="checkbox" id="msgToggle" checked> 消息</label>
    <span class="spacer"></span>
    <button class="btn-mini desktop-only" id="btnGto">GTO 表</button>
    <button class="btn-mini desktop-only" id="btnGuide">规则</button>
    <button class="btn-mini desktop-only" id="btnChallenge" title="挑战模式">🏆</button>
    <button class="btn-mini desktop-only" id="btnSound" title="背景音乐开关">🔊 声音</button>
    <button class="btn-mini desktop-only" id="btnSettings">设置</button>
    <button class="btn-mini desktop-only" id="btnStats">统计</button>
    <button class="btn-mini desktop-only" id="btnHistory">牌谱</button>
    <button class="btn-mini desktop-only" id="btnRestart">重开</button>
    <button class="btn-mini mobile-only" id="btnMore">⋯</button>
  </header>

  <div class="main">
    <div class="table-wrap">
      <div class="table">
        <div class="felt"></div>

        <div class="seats" id="seats"></div>

        <div class="center">
          <div class="pot-box">底池 <b id="potValue">0</b></div>
          <div class="board" id="board"></div>
          <div class="street-label" id="streetLabel">等待开局</div>
        </div>
      </div>
    </div>

    <aside class="info" id="infoPanel">
      <div class="info-close mobile-only" id="infoClose">收起 ▾</div>
      <div class="info-section">
        <h4>局面</h4>
        <div class="info-row"><span>位置</span><b id="infoPos">—</b></div>
        <div class="info-row"><span>要跟注</span><b id="infoToCall">0</b></div>
        <div class="info-row"><span>所需胜率</span><b id="infoOdds">—</b></div>
        <div class="info-row"><span>牌力估计</span><b id="infoStrength">—</b></div>
        <div class="info-row"><span>AI 读你</span><b id="infoRead">—</b></div>
        <div id="planDebug" style="display:none">
          <div class="info-row" style="color:var(--text-soft);margin-top:6px">本手计划（调试）</div>
          <div id="planDebugBody"></div>
        </div>
      </div>
      <div class="info-section">
        <h4>起手牌参考</h4>
        <div class="hand-tip" id="handTip">—</div>
      </div>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <div class="guide-tip" id="guideTip" style="display:none">
    <span>第一次玩？要不要看一遍手把手的引导？</span>
    <button class="btn check" id="guideStart">看一遍</button>
    <button class="btn-mini" id="guideNo">不用了</button>
  </div>

  <div class="guide-bar" id="guideBar" style="display:none">
    <span id="guideText"></span>
    <span class="guide-step" id="guideStep">1/6</span>
    <button class="btn raise" id="guideNext">下一步</button>
    <button class="btn-mini" id="guideSkip">退出</button>
  </div>

  <footer class="actionbar">
    <button class="btn-mini mobile-only info-btn" id="btnInfo">信息</button>
    <div class="hint" id="actionHint">点「开始新一手」发牌</div>
    <div class="actionbuttons" id="actionButtons"></div>
    <div class="odds-hint" id="oddsHint"></div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

  // 返回可字典序比较的数组：[类别, 主牌…, 次级…]
  // 类别：0 高牌 / 1 对子 / 2 两对 / 3 三条 / 4 顺子 / 5 同花 / 6 葫芦 / 7 四条 / 8 同花顺
  function eval5(cards) {
    var rs = cards.map(function (c) { return c.r; }).sort(function (a, b) { return b - a; });
    var flush = cards.every(function (c) { return c.s === cards[0].s; });
    var uniq = [];
    for (var i = 0; i < rs.length; i++) if (uniq.indexOf(rs[i]) < 0) uniq.push(rs[i]);
    var straightHigh = 0;
    if (uniq.length === 5) {
      if (uniq[0] - uniq[4] === 4) straightHigh = uniq[0];
      else if (uniq[0] === 14 && uniq[1] === 5 && uniq[2] === 4 && uniq[3] === 3 && uniq[4] === 2) straightHigh = 5;
    }
    var cnt = {};
    for (var k = 0; k < rs.length; k++) cnt[rs[k]] = (cnt[rs[k]] || 0) + 1;
    var groups = Object.keys(cnt).map(function (r) { return { r: +r, c: cnt[r] }; })
      .sort(function (a, b) { return b.c - a.c || b.r - a.r; });

    if (flush && straightHigh) return [8, straightHigh];
    if (groups[0].c === 4) return [7, groups[0].r, groups[1].r];
    if (groups[0].c === 3 && groups[1].c === 2) return [6, groups[0].r, groups[1].r];
    if (flush) return [5].concat(rs);
    if (straightHigh) return [4, straightHigh];
    if (groups[0].c === 3) {
      return [3, groups[0].r].concat(rs.filter(function (r) { return r !== groups[0].r; }));
    }
    if (groups[0].c === 2 && groups[1].c === 2) {
      var hi = Math.max(groups[0].r, groups[1].r);
      var lo = Math.min(groups[0].r, groups[1].r);
      var kicker = rs.filter(function (r) { return r !== hi && r !== lo; })[0];
      return [2, hi, lo, kicker];
    }
    if (groups[0].c === 2) {
      return [1, groups[0].r].concat(rs.filter(function (r) { return r !== groups[0].r; }));
    }
    return [0].concat(rs);
  }

  var COMBOS_7_5 = (function () {
    var res = [];
    for (var a = 0; a < 7; a++) for (var b = a + 1; b < 7; b++) for (var c = b + 1; c < 7; c++)
      for (var d = c + 1; d < 7; d++) for (var e = d + 1; e < 7; e++) res.push([a, b, c, d, e]);
    return res;
  })();

  function cmpVal(a, b) {
    var n = Math.max(a.length, b.length);
    for (var i = 0; i < n; i++) {
      var x = a[i] || 0, y = b[i] || 0;
      if (x !== y) return x - y;
    }
    return 0;
  }

  function eval7(cards) {
    // 支持 5~7 张：取所有 5 张组合里最大的一手
    var n = cards.length;
    if (n < 5) throw new Error('eval7 至少需要 5 张牌，收到 ' + n);
    var best = null;
    for (var a = 0; a < n - 4; a++) {
      for (var b = a + 1; b < n - 3; b++) {
        for (var c = b + 1; c < n - 2; c++) {
          for (var d = c + 1; d < n - 1; d++) {
            for (var e = d + 1; e < n; e++) {
              var v = eval5([cards[a], cards[b], cards[c], cards[d], cards[e]]);
              if (!best || cmpVal(v, best) > 0) best = v;
            }
          }
        }
      }
    }
    return best;
  }

  var HAND_CN = ['高牌', '一对', '两对', '三条', '顺子', '同花', '葫芦', '四条', '同花顺'];

  // ---------------- 建局 ----------------
  function createGame(opts) {
    opts = opts || {};
    var mode = opts.mode === 'nine' ? 'nine' : (opts.mode === 'hu' ? 'hu' : 'six');
    var n = mode === 'hu' ? 2 : (mode === 'nine' ? 9 : 6);
    var names = {
      hu: [opts.playerName || '你', opts.aiName || 'AI·小白'],
      six: ['你', 'AI·阿鲸', 'AI·小海', 'AI·泡泡', 'AI·浪花', 'AI·珊瑚'],
      nine: ['你', 'AI·阿鲸', 'AI·小海', 'AI·泡泡', 'AI·浪花', 'AI·珊瑚',
             'AI·海星', 'AI·水母', 'AI·墨鱼']
    }[mode];
    var avatars = ['🐋', '🦈', '🐙', '🐠', '🐢', '🦀', '⭐', '🪼', '🦑'];
    var chips = opts.startingChips || 2000;
    var bb = opts.bigBlind || 20;
    var players = [];
    for (var i = 0; i < n; i++) {
      players.push({
        id: i, name: names[i], seat: i, chips: chips,
        hole: [], streetBet: 0, totalBet: 0,
        folded: false, allIn: false, acted: false,
        facedRaiseAmount: 0, actedBeforeLastFullRaise: false, reopenEligible: false,
        avatar: avatars[i % avatars.length], emotion: 'idle',
        holeRevealed: false
      });
    }
    return {
      mode: mode,
      // 人类座位：UI 里是 0，纯 AI 对局（bench）不传 → null。
      // 只用来决定「要不要抓诈唬」——AI 互打时保持紧，对人才放宽。
      humanSeat: opts.humanSeat === undefined ? null : opts.humanSeat,
      players: players,
      smallBlind: opts.smallBlind || 10,
      bigBlind: bb,
      buyIn: opts.buyIn || chips,
      handId: 0,
      buttonSeat: 0,
      seed: opts.seed || (Date.now() % 2147483647),
      deck: [], deckState: [], board: [],
      street: 'idle',
      pot: 0,
      streetCurrentBet: 0,
      lastFullRaiseSize: bb,
      raiseAccumulator: 0,
      activeSeat: -1,
      lastAggressor: -1,
      sidePots: [], deadMoney: [], refunds: [],
      actions: [], messages: [],
      result: null,
      handOver: true,
      aiLevel: opts.aiLevel || 'normal',
      autoRebuy: opts.autoRebuy !== false,
      handsPlayed: 0,
      rebuys: 0,
      log: []
    };
  }

  // ---------------- 位置 ----------------
  function sbSeat(g) { return g.mode === 'hu' ? g.buttonSeat : (g.buttonSeat + 1) % g.players.length; }
  function bbSeat(g) { return g.mode === 'hu' ? (g.buttonSeat + 1) % g.players.length : (g.buttonSeat + 2) % g.players.length; }

  function alivePlayers(g) {
    return g.players.filter(function (p) { return !p.folded; });
  }
  function canActPlayers(g) {
    return g.players.filter(function (p) { return !p.folded && !p.allIn; });
  }

  function nextToAct(g, fromSeat) {
    var n = g.players.length;
    for (var i = 1; i <= n; i++) {
      var s = (fromSeat + i) % n;
      var p = g.players[s];
      if (!p.folded && !p.allIn) return s;
    }
    return -1;
  }

  function firstToActPostflop(g) {
    var n = g.players.length;
    var start = (g.buttonSeat + 1) % n;
    for (var i = 0; i < n; i++) {
      var s = (start + i) % n;
      var p = g.players[s];
      if (!p.folded && !p.allIn) return s;
    }
    return -1;
  }

  // ---------------- 发牌 ----------------
  function draw(g) {
    // 从牌堆顶取一张，并记入 deckState
    var c = g.deck.pop();
    return { r: c.r, s: c.s };
  }

  function burnAndDeal(g, count) {
    var b = draw(g);
    g.deckState.push({ r: b.r, s: b.s, burn: true });
    for (var i = 0; i < count; i++) {
      var c = draw(g);
      g.board.push({ r: c.r, s: c.s });
      g.deckState.push({ r: c.r, s: c.s });
    }
  }

  // ---------------- 开一手 ----------------
  function startHand(g) {
    if (g.players.some(function (p) { return p.chips <= 0; })) {
      throw new Error('有玩家筹码为 0，需先补码');
    }
    g.handId++;
    g.actions = [];
    g.messages = [];
    g.board = [];
    g.deckState = [];
    g.sidePots = [];
    g.deadMoney = [];
    g.refunds = [];
    g.pot = 0;
    g.streetCurrentBet = 0;
    g.lastFullRaiseSize = g.bigBlind;
    g.raiseAccumulator = 0;
    g.street = 'preflop';
    g.lastAggressor = -1;
    g.result = null;
    g.handOver = false;
    g.log = [];
    g.streetLabel = '翻前';

    g.players.forEach(function (p) {
      p.hole = [];
      p.streetBet = 0;
      p.totalBet = 0;
      p.folded = false;
      p.allIn = false;
      p.acted = false;
      p.facedRaiseAmount = 0;
      p.actedBeforeLastFullRaise = false;
      p.reopenEligible = false;
      p.holeRevealed = false;
      p.emotion = 'idle';
    });

    // 洗牌
    var rng = mulberry32((g.seed + g.handId * 7919) >>> 0);
    g.deck = shuffle(makeDeck(), rng);

    // 发底牌：从 SB 起，两轮各一张
    var n = g.players.length;
    var first = sbSeat(g);
    for (var round = 0; round < 2; round++) {
      for (var i = 0; i < n; i++) {
        var seat = (first + i) % n;
        var c = draw(g);
        g.players[seat].hole.push({ r: c.r, s: c.s });
        g.deckState.push({ r: c.r, s: c.s, hole: true });
      }
    }

    // 盲注
    var sbP = g.players[sbSeat(g)];
    var bbP = g.players[bbSeat(g)];
    postBlind(g, sbP, g.smallBlind);
    postBlind(g, bbP, g.bigBlind);
    // 法定盲注额不因短码改变
    g.streetCurrentBet = g.bigBlind;

    // 先行动
    var startSeat;
    if (g.mode === 'hu') startSeat = g.buttonSeat;           // BTN/SB 先
    else startSeat = (g.buttonSeat + 3) % n;                 // UTG
    g.activeSeat = findPlayable(g, startSeat);

    logLine(g, '—— 第 ' + g.handId + ' 手开始，盲注 ' + g.smallBlind + '/' + g.bigBlind + ' ——');

    if (g.activeSeat < 0) {
      // 开局就没人能行动（极端短码），直接推进
      g.activeSeat = -1;
      advanceStreet(g);
    }
    return g;
  }

  function findPlayable(g, seat) {
    var n = g.players.length;
    for (var i = 0; i < n; i++) {
      var s = (seat + i) % n;
      var p = g.players[s];
      if (!p.folded && !p.allIn) return s;
    }
    return -1;
  }

  function postBlind(g, p, amount) {
    var pay = Math.min(amount, p.chips);
    p.chips -= pay;
    p.streetBet += pay;
    p.totalBet += pay;
    g.pot += pay;
    if (p.chips === 0) p.allIn = true;
    p.acted = false;
  }

  // ---------------- 重新开放加注权 ----------------
  // 轮到该玩家行动时调用：先复位，再按「完整加注前已行动 + 累计面对额 + 非最后抬价者」判定
  function computeReopen(g, seat) {
    var p = g.players[seat];
    var ok = false;
    if (!p.folded && !p.allIn && p.actedBeforeLastFullRaise === true) {
      if (p.facedRaiseAmount >= g.lastFullRaiseSize && g.lastAggressor !== seat) {
        ok = true;
      }
    }
    p.reopenEligible = ok;
    return ok;
  }

  // ---------------- 合法动作 ----------------
  function legalActionsFor(g, seat) {
    var p = g.players[seat];
    if (g.activeSeat !== seat || p.folded || p.allIn) return [];
    var toCall = g.streetCurrentBet - p.streetBet;
    var acts = [];
    acts.push({ type: 'fold' });
    if (toCall <= 0) {
      acts.push({ type: 'check' });
    } else {
      acts.push({ type: 'call', amount: Math.min(toCall, p.chips) });
    }

    // 重新开放判定：本轮行动是否需要「完整加注前已行动但累计不够」的限制
    p.reopenEligible = false;
    var canRaise = true;
    if (p.actedBeforeLastFullRaise === true) {
      canRaise = computeReopen(g, seat);
    }

    if (canRaise) {
      // 加注：最小 = 当前注 + 最近完整加注增量
      var minRaiseTo = g.streetCurrentBet + g.lastFullRaiseSize;
      var maxRaiseTo = p.streetBet + p.chips;
      if (minRaiseTo <= maxRaiseTo) {
        acts.push({ type: 'raise', min: minRaiseTo, max: maxRaiseTo });
      }
      if (maxRaiseTo > g.streetCurrentBet) {
        acts.push({ type: 'allin', amount: maxRaiseTo });
      }
    } else {
      // 没有加注权：只能全下跟注（不超过当前注）
      var allInTo = p.streetBet + p.chips;
      if (p.chips > 0 && allInTo <= g.streetCurrentBet) {
        acts.push({ type: 'allin', amount: allInTo });
      }
    }
    return acts;
  }

  // ---------------- 执行动作 ----------------
  function act(g, seat, action) {
    if (seat == null || seat < 0 || !g.players[seat]) throw new Error('无效的座位：' + seat);
    var p = g.players[seat];
    if (g.activeSeat !== seat) throw new Error('不是该玩家行动');
    if (p.folded || p.allIn) throw new Error('该玩家无法行动');

    var prevCurrentBet = g.streetCurrentBet;
    var potBefore = g.pot;
    var toCallBefore = Math.max(0, g.streetCurrentBet - p.streetBet);
    var aliveBefore = g.players.filter(function (q) { return !q.folded; }).length;
    var pay = 0;
    var type = action.type;

    if (type === 'fold') {
      p.folded = true;
    } else if (type === 'check') {
      if (p.streetBet !== g.streetCurrentBet) throw new Error('不能过牌：还有待跟注');
    } else if (type === 'call') {
      pay = Math.min(g.streetCurrentBet - p.streetBet, p.chips);
    } else if (type === 'raise' || type === 'allin') {
      var target = action.amount;
      if (type === 'allin') target = p.streetBet + p.chips;
      else if (target == null) target = action.min;   // 防御：只给了 min/max 时按最小加注
      if (typeof target !== 'number' || isNaN(target)) throw new Error('加注金额无效');
      if (target <= g.streetCurrentBet) {
        // 全下不足以跟注：视为短全下
        target = p.streetBet + p.chips;
      }
      pay = Math.min(target - p.streetBet, p.chips);
      if (pay < 0) throw new Error('下注金额不能为负：' + pay);
    } else {
      throw new Error('未知动作 ' + type);
    }

    var beforeTotal = p.totalBet;
    p.chips -= pay;
    p.streetBet += pay;
    p.totalBet += pay;
    g.pot += pay;
    if (p.chips === 0) p.allIn = true;

    var isRaise = p.streetBet > prevCurrentBet;
    var raiseDelta = p.streetBet - prevCurrentBet;
    var fullRaise = false;

    // 落账：先更新玩家自身状态（acted 已置位），再做完整加注判定与快照
    p.facedRaiseAmount = 0;
    p.acted = true;

    if (isRaise) {
      g.streetCurrentBet = p.streetBet;
      if (raiseDelta >= g.lastFullRaiseSize) {
        fullRaise = true;
      } else {
        g.raiseAccumulator += raiseDelta;
        if (g.raiseAccumulator >= g.lastFullRaiseSize) {
          fullRaise = true;
        }
      }
      // 玩家字段：其他已行动者累加面对的新增额
      g.players.forEach(function (q) {
        if (q === p) return;
        if (q.acted) q.facedRaiseAmount += raiseDelta;
      });
      if (fullRaise) {
        // 快照：本次 action 落账之后、完整加注处理之前
        g.players.forEach(function (q) { q.actedBeforeLastFullRaise = q.acted; });
        g.lastFullRaiseSize = (raiseDelta >= g.lastFullRaiseSize) ? raiseDelta : g.raiseAccumulator;
        g.raiseAccumulator = 0;
        g.lastAggressor = seat;
      }
    }

    // 记录 action
    var rec = {
      street: g.street,
      playerId: p.id,
      type: type,
      amountBefore: beforeTotal,
      amountAdded: pay,
      streetBetAfter: p.streetBet,
      potAfter: g.pot,
      potBefore: potBefore,
      toCallBefore: toCallBefore,
      aliveBefore: aliveBefore,
      streetCurrentBetAfter: g.streetCurrentBet,
      lastFullRaiseSizeAfter: g.lastFullRaiseSize,
      raiseAccumulatorAfter: g.raiseAccumulator,
      board: g.board.slice(),
      fullRaise: fullRaise
    };
    g.actions.push(rec);
    logAction(g, p, type, pay);

    // 推进
    maybeAdvance(g);
    return rec;
  }

  function maybeAdvance(g) {
    var alive = alivePlayers(g);
    if (alive.length <= 1) {
      g.activeSeat = -1;
      settle(g);
      return;
    }
    var actable = canActPlayers(g);
    if (actable.length === 0) {
      // 全员全下：发完公共牌
      g.activeSeat = -1;
      runOutBoard(g);
      return;
    }
    // 下注轮结束判定
    var over = actable.every(function (q) {
      return q.acted && q.streetBet === g.streetCurrentBet;
    });
    if (over) {
      advanceStreet(g);
      return;
    }
    var nxt = nextToAct(g, g.activeSeat);
    g.activeSeat = nxt;
    if (nxt < 0) {
      // 没有可行动的人，但有人未跟平？理论不该出现
      advanceStreet(g);
    }
  }

  function advanceStreet(g) {
    // 每街开始清空玩家级字段
    g.players.forEach(function (p) {
      p.streetBet = 0;
      p.acted = false;
      p.facedRaiseAmount = 0;
      p.actedBeforeLastFullRaise = false;
      p.reopenEligible = false;
    });
    g.streetCurrentBet = 0;
    g.lastFullRaiseSize = g.bigBlind;
    g.raiseAccumulator = 0;
    g.lastAggressor = -1;

    if (g.street === 'preflop') {
      burnAndDeal(g, 3);
      g.street = 'flop';
    } else if (g.street === 'flop') {
      burnAndDeal(g, 1);
      g.street = 'turn';
    } else if (g.street === 'turn') {
      burnAndDeal(g, 1);
      g.street = 'river';
    } else if (g.street === 'river') {
      g.street = 'showdown';
      g.activeSeat = -1;
      settle(g);
      return;
    }
    g.streetLabel = { preflop: '翻前', flop: '翻牌', turn: '转牌', river: '河牌', showdown: '摊牌' }[g.street];
    logLine(g, '【' + g.streetLabel + '】' + g.board.map(cardStr).join(' '));

    var first = firstToActPostflop(g);
    if (first < 0) {
      // 都全下了，继续发
      advanceStreet(g);
      return;
    }
    g.activeSeat = first;
    // 只剩一人能行动且无需跟注时，直接跳过
    var actable = canActPlayers(g);
    if (actable.length === 1 && actable[0].streetBet === g.streetCurrentBet) {
      // 让他过牌结束本街
    }
  }

  function runOutBoard(g) {
    if (g.street === 'preflop') { burnAndDeal(g, 3); g.street = 'flop'; }
    if (g.street === 'flop') { burnAndDeal(g, 1); g.street = 'turn'; }
    if (g.street === 'turn') { burnAndDeal(g, 1); g.street = 'river'; }
    g.streetLabel = { preflop: '翻前', flop: '翻牌', turn: '转牌', river: '河牌', showdown: '摊牌' }[g.street];
    g.street = 'showdown';
    g.activeSeat = -1;
    settle(g);
  }

  // ---------------- 边池与结算 ----------------
  function buildLayers(g) {
    // 所有玩家的 totalBet 唯一层级，升序
    var levels = [];
    g.players.forEach(function (p) {
      if (levels.indexOf(p.totalBet) < 0) levels.push(p.totalBet);
    });
    levels.sort(function (a, b) { return a - b; });

    var pots = [];
    var prev = 0;
    for (var i = 0; i < levels.length; i++) {
      var lv = levels[i];
      if (lv <= prev) continue;
      var contributors = g.players.filter(function (p) { return p.totalBet >= lv; });
      var amount = (lv - prev) * contributors.length;
      var eligible = contributors.filter(function (p) { return !p.folded; }).map(function (p) { return p.id; });
      if (amount > 0) {
        pots.push({
          amount: amount,
          eligible: eligible,
          resolution: eligible.length >= 2 ? 'showdown' : (eligible.length === 1 ? 'direct' : 'dead'),
          winnerId: eligible.length === 1 ? eligible[0] : null,
          level: lv
        });
      }
      prev = lv;
    }
    return pots;
  }

  function mergeDeadLayers(g, pots) {
    // dead 层并入最近的下方可竞争层
    var result = pots.map(function (p) {
      return { amount: p.amount, eligible: p.eligible.slice(), resolution: p.resolution, winnerId: p.winnerId, level: p.level };
    });
    g.deadMoney = [];
    for (var i = 0; i < result.length; i++) {
      if (result[i].resolution !== 'dead') continue;
      var target = -1;
      for (var j = i - 1; j >= 0; j--) {
        if (result[j].resolution !== 'dead') { target = j; break; }
      }
      if (target < 0) {
        for (var k = i + 1; k < result.length; k++) {
          if (result[k].resolution !== 'dead') { target = k; break; }
        }
      }
      if (target < 0) continue; // 理论不可达
      g.deadMoney.push({ amount: result[i].amount, mergedIntoLayer: target });
      result[target].amount += result[i].amount;
      result[i].amount = 0;
    }
    return result.filter(function (p) { return p.amount > 0; });
  }

  function seatOrderFromButton(g, seat) {
    var n = g.players.length;
    return (seat - g.buttonSeat - 1 + n) % n;
  }

  function bestValue(g, p) {
    return eval7(p.hole.concat(g.board));
  }

  function settle(g) {
    g.street = 'showdown';
    g.activeSeat = -1;
    g.handOver = true;

    var alive = alivePlayers(g);

    // 未被跟注的超额投入必须退还（TDA：uncalled bet returned）
    // 即使投入者已经弃牌：他投到「所有未弃牌玩家最高投入」以上的部分没人能跟，
    // 必须退回，否则短筹码全下时会把长筹码多押的钱一并赢走。
    g.refunds = g.refunds || [];
    if (alive.length > 0) {
      var maxAlive = alive.reduce(function (m, p) { return Math.max(m, p.totalBet); }, 0);
      g.players.forEach(function (p) {
        if (p.totalBet > maxAlive) {
          var excess = p.totalBet - maxAlive;
          p.chips += excess;
          p.totalBet = maxAlive;
          g.pot -= excess;
          g.refunds.push({ playerId: p.id, amount: excess });
        }
      });
    }

    var pots = mergeDeadLayers(g, buildLayers(g));
    g.sidePots = pots.map(function (p) {
      return { amount: p.amount, eligible: p.eligible.slice(), resolution: p.resolution, winnerId: p.winnerId };
    });

    var totalBefore = g.players.reduce(function (s, p) { return s + p.totalBet; }, 0);
    var potSum = pots.reduce(function (s, p) { return s + p.amount; }, 0);
    var refundSum = g.refunds.reduce(function (s, p) { return s + p.amount; }, 0);
    if (potSum !== totalBefore) {
      throw new Error('守恒断言失败：sidePots=' + potSum + ' refunds=' + refundSum + ' totalBet=' + totalBefore);
    }

    var results = [];
    var handNames = {};

    if (alive.length === 1) {
      // 只剩一人：直接收池，不亮牌
      var only = alive[0];
      var pool = g.pot;
      only.chips += pool;
      results.push({ playerId: only.id, amount: pool, reason: '其他人都弃牌' });
      g.result = { winners: results, pot: pool, showdown: false };
    } else {
      // 逐个池分配
      pots.forEach(function (pot, idx) {
        if (pot.resolution === 'direct') {
          var w = g.players[pot.winnerId];
          w.chips += pot.amount;
          results.push({ playerId: w.id, amount: pot.amount, reason: '未被跟注的投入', potIndex: idx });
          return;
        }
        // showdown：比牌
        var contenders = pot.eligible.map(function (id) { return g.players[id]; });
        var vals = contenders.map(function (p) {
          var v = bestValue(g, p);
          handNames[p.id] = HAND_CN[v[0]];
          return { p: p, v: v };
        });
        var best = vals[0].v;
        vals.forEach(function (x) { if (cmpVal(x.v, best) > 0) best = x.v; });
        var winners = vals.filter(function (x) { return cmpVal(x.v, best) === 0; }).map(function (x) { return x.p; });

        var share = Math.floor(pot.amount / winners.length);
        var rem = pot.amount - share * winners.length;
        winners.forEach(function (p) { p.chips += share; });
        var ordered = winners.slice().sort(function (a, b) {
          return seatOrderFromButton(g, a.seat) - seatOrderFromButton(g, b.seat);
        });
        for (var i = 0; i < rem; i++) ordered[i].chips += 1;

        winners.forEach(function (p) {
          var got = share + (rem > 0 && ordered.indexOf(p) < rem ? 1 : 0);
          results.push({
            playerId: p.id, amount: got, reason: HAND_CN[best[0]],
            potIndex: idx, isMain: idx === 0, hand: best
          });
        });
      });
      // 亮牌
      alive.forEach(function (p) { p.holeRevealed = true; });

      // 恶意逆转（bad beat）：玩家在转牌结束时领先所有人，河牌被反超
      var badBeat = null;
      var meP = g.players[0];
      if (g.board.length === 5 && meP && !meP.folded && alive.length >= 2) {
        var iWonAnyway = results.some(function (r) { return r.playerId === 0; });
        if (!iWonAnyway) {
          var b4 = g.board.slice(0, 4);
          var myV = eval7(meP.hole.concat(b4));
          var stillAhead = true;
          alive.forEach(function (p) {
            if (p.id === 0) return;
            if (cmpVal(eval7(p.hole.concat(b4)), myV) > 0) stillAhead = false;
          });
          if (stillAhead) {
            var whoBeat = results.filter(function (r) { return r.playerId !== 0; });
            badBeat = { byPlayerId: whoBeat.length ? whoBeat[0].playerId : -1 };
          }
        }
      }

      g.result = { winners: results, pot: totalBefore, showdown: true, handNames: handNames, badBeat: badBeat };
    }

    g.pot = 0;
    g.streetLabel = '摊牌';
    logLine(g, '结算：' + results.map(function (r) {
      return g.players[r.playerId].name + ' +' + r.amount;
    }).join('，'));
    g.handsPlayed++;
    return g.result;
  }

  // ---------------- 日志 ----------------
  function logLine(g, text) {
    g.log.push({ type: 'text', text: text });
  }

  function logAction(g, p, type, pay) {
    var cn = { fold: '弃牌', check: '过牌', call: '跟注', raise: '加注', allin: '全下' };
    var txt = p.name + ' ' + (cn[type] || type);
    if (pay > 0) txt += ' ' + pay;
    g.log.push({ type: 'action', text: txt });
  }

  // ---------------- 下一手 ----------------
  function nextHand(g) {
    // 按钮轮转：移给下一位有筹码的玩家
    var n = g.players.length;
    var next = (g.buttonSeat + 1) % n;
    var guard = 0;
    while (g.players[next].chips <= 0 && guard < n) {
      next = (next + 1) % n;
      guard++;
    }
    g.buttonSeat = next;
    // 自动补码（挑战模式下关闭：输光就是输光）
    if (g.autoRebuy !== false) g.players.forEach(function (p) {
      if (p.chips <= 0) {
        p.chips = g.buyIn;
        g.rebuys++;
        g.rebuyEvents = g.rebuyEvents || [];
        g.rebuyEvents.push({ type: 'autoRebuy', amount: g.buyIn, time: Date.now() });
      }
    });
    startHand(g);
  }

  // ---------------- 导出（给 UI 与测试） ----------------
  global.PokerEngine = {
    createGame: createGame,
    startHand: startHand,
    nextHand: nextHand,
    legalActionsFor: legalActionsFor,
    computeReopen: computeReopen,
    act: act,
    advanceStreet: advanceStreet,
    settle: settle,
    eval5: eval5,
    eval7: eval7,
    cmpVal: cmpVal,
    buildLayers: buildLayers,
    mergeDeadLayers: mergeDeadLayers,
    alivePlayers: alivePlayers,
    canActPlayers: canActPlayers,
    sbSeat: sbSeat,
    bbSeat: bbSeat,
    bestValue: bestValue,
    makeDeck: makeDeck,
    shuffle: shuffle,
    mulberry32: mulberry32,
    HAND_CN: HAND_CN,
    cardStr: cardStr,
    RANK_SYM: RANK_SYM,
    SUIT_SYM: SUIT_SYM
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script id="ui">
/* =====================================================================
   界面层：渲染 / 玩家操作 / 简单 AI / 牌谱

(function () {
  'use strict';
  var E = window.PokerEngine;

  var game = null;

  var resultShown = false;     // 本手结果弹层是否已弹
  var raiseValue = 0;

  // =====================================================================
  //  音频：Web Audio 实时合成，零音频文件
  //  背景音乐是 ii-V-I-vi 的爵士循环（钢琴分解 + 贝斯 + pad + 稀疏铃声）
  //  音效全部现场合成：发牌 / 筹码 / 输赢 / 轮到你
  // =====================================================================
  var Sound = (function () {
    var ctx = null, musicBus = null, sfxBus = null;
    var S = { musicOn: true, sfxOn: true, musicVol: 0.28, sfxVol: 0.55 };
    var musicTimer = null, musicRunning = false, step = 0;

    try {
      var raw = JSON.parse(localStorage.getItem('poker.audio.v1') || '{}');
      if (typeof raw.musicOn === 'boolean') S.musicOn = raw.musicOn;
      if (typeof raw.sfxOn === 'boolean') S.sfxOn = raw.sfxOn;
      if (typeof raw.musicVol === 'number') S.musicVol = Math.max(0, Math.min(1, raw.musicVol));
      if (typeof raw.sfxVol === 'number') S.sfxVol = Math.max(0, Math.min(1, raw.sfxVol));
    } catch (e) {}

    function persist() {
      try { localStorage.setItem('poker.audio.v1', JSON.stringify(S)); } catch (e) {}
    }

    function ensure() {
      if (ctx) {
        if (ctx.state === 'suspended') ctx.resume();

      }

      if (!AC) return null;

      sfxBus = ctx.createGain(); sfxBus.gain.value = S.sfxVol; sfxBus.connect(ctx.destination);
      return ctx;
    }

    function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }

    function tone(freq, when, dur, type, peak, bus, detune) {
      var c = ensure(); if (!c || !bus) return;
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      if (detune) o.detune.value = detune;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(bus);
      o.start(when); o.stop(when + dur + 0.05);
    }

    function noise(when, dur, peak, bus, hp) {
      var c = ensure(); if (!c || !bus) return;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
      var g = c.createGain(); g.gain.value = peak;
      src.connect(f); f.connect(g); g.connect(bus);
      src.start(when);
    }

    var SFX = {
      deal: function () {
        var c = ensure(); if (!c || !S.sfxOn) return;
        var t = c.currentTime;
        noise(t, 0.08, 0.42, sfxBus, 2000);

      chip: function (amount) {

        var t = c.currentTime;
        var big = Math.min(1, Math.log10(Math.max(10, amount || 10)) / 3.5);
        noise(t, 0.05, 0.20 + big * 0.28, sfxBus, 2600);
        tone(1400 + big * 400, t, 0.05, 'square', 0.025 + big * 0.028, sfxBus);
        tone(900, t + 0.02, 0.06, 'triangle', 0.035, sfxBus);
      },
      win: function () {
        var c = ensure(); if (!c || !S.sfxOn) return;
        var t = c.currentTime;
        [72, 76, 79, 84].forEach(function (n, i) {
          tone(midi(n), t + i * 0.09, 0.5, 'triangle', 0.095, sfxBus);
        });
      },
      lose: function () {
        var c = ensure(); if (!c || !S.sfxOn) return;
        var t = c.currentTime;
        [64, 60, 55].forEach(function (n, i) {
          tone(midi(n), t + i * 0.10, 0.45, 'sine', 0.085, sfxBus);
        });
      },
      badbeat: function () {
        var c = ensure(); if (!c || !S.sfxOn) return;
        var t = c.currentTime;
        tone(midi(45), t, 0.75, 'sawtooth', 0.11, sfxBus);
        tone(midi(38), t + 0.16, 0.9, 'sine', 0.10, sfxBus);
        noise(t + 0.02, 0.35, 0.09, sfxBus, 500);
      },
      turn: function () {
        var c = ensure(); if (!c || !S.sfxOn) return;
        var t = c.currentTime;
        tone(1046, t, 0.14, 'sine', 0.065, sfxBus);
        tone(1568, t + 0.09, 0.20, 'sine', 0.045, sfxBus);
      }
    };

    // ii-V-I-vi：Dm9 → G13 → Cmaj9 → Am9，每小节 2.4 秒
    var CHORDS = [
      { root: 50, notes: [62, 65, 69, 72, 76] },
      { root: 43, notes: [59, 62, 65, 69, 72] },
      { root: 48, notes: [55, 59, 62, 64, 67] },
      { root: 45, notes: [60, 64, 67, 71, 74] }
    ];
    var BAR = 2.4;

    function playBar() {
      var c = ensure(); if (!c) return;
      var t = c.currentTime + 0.05;
      var ch = CHORDS[step % CHORDS.length];
      var arp = [0, 2, 1, 3, 4, 3, 1, 2];
      for (var i = 0; i < 8; i++) {
        tone(midi(ch.notes[arp[i] % ch.notes.length]), t + i * (BAR / 8), 0.55, 'triangle', 0.042, musicBus);
      }
      tone(midi(ch.root), t, 0.9, 'sine', 0.085, musicBus);
      tone(midi(ch.root), t + BAR / 2, 0.9, 'sine', 0.070, musicBus);
      tone(midi(ch.notes[0]), t, BAR + 0.4, 'sine', 0.028, musicBus, -6);
      tone(midi(ch.notes[2]), t, BAR + 0.4, 'sine', 0.024, musicBus, 7);
      if (Math.random() < 0.30) {
        var hi = ch.notes[Math.floor(Math.random() * ch.notes.length)] + 24;
        tone(midi(hi), t + Math.random() * BAR, 1.4, 'sine', 0.018, musicBus);
      }
      step++;
    }

    function startMusic() {
      if (!S.musicOn || musicRunning) return;
      if (!ensure()) return;
      musicRunning = true; step = 0;
      playBar();
      musicTimer = setInterval(playBar, BAR * 1000);
    }
    function stopMusic() {
      musicRunning = false;
      if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
    }

    return {
      unlock: function () { if (S.musicOn && !musicRunning) startMusic(); },
      play: function (name, arg) { try { if (SFX[name]) SFX[name](arg); } catch (e) {} },
      setMusic: function (on) { S.musicOn = !!on; persist(); if (on) startMusic(); else stopMusic(); },
      setSfx: function (on) { S.sfxOn = !!on; persist(); },
      setMusicVol: function (v) {

      setSfxVol: function (v) {
        S.sfxVol = Math.max(0, Math.min(1, v)); persist();

      get: function () { return { musicOn: S.musicOn, sfxOn: S.sfxOn, musicVol: S.musicVol, sfxVol: S.sfxVol }; }
    };
  })();

  // ---------------- 渲染 ----------------
  function cardEl(c, small) {

  function posLabel(seat) {
    if (game.mode === 'hu') return seat === game.buttonSeat ? 'BTN/SB' : 'BB';
    var n = game.players.length;

    var names = n === 9
      ? ['BTN', 'SB', 'BB', 'UTG', 'UTG+1', 'MP', 'MP+1', 'HJ', 'CO']
      : ['BTN', 'SB', 'BB', 'UTG', 'MP', 'CO'];

  }

  // ---------------- 座位布局 ----------------
  var seatEls = [];

  var AVATAR_PREFIX = 'poker.avatar.v1.';

  }

  function clearAvatar(key) {
    if (!key) return;
    try { localStorage.removeItem(AVATAR_PREFIX + key); } catch (e) {}
  }

  function dataUrlBytes(url) {
    var i = url.indexOf(',');
    if (i < 0) return url.length;
    return Math.round((url.length - i - 1) * 3 / 4);
  }

  function setAvatarFromFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { alert('只能选图片文件。'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = 64; cv.height = 64;
        var ctx = cv.getContext('2d');
        var side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 64, 64);
        var url = cv.toDataURL('image/jpeg', 0.80);
        if (dataUrlBytes(url) > AVATAR_MAX_BYTES) url = cv.toDataURL('image/jpeg', 0.55);
        if (dataUrlBytes(url) > AVATAR_MAX_BYTES) {
          alert('这张图压到 64×64 还有 ' + Math.ceil(dataUrlBytes(url) / 1024) + 'KB，超过 8KB，换一张吧。');
          return;
        }
        var st = loadSettings();
        clearAvatar(st.myAvatarKey);
        var key = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              var r = Math.random() * 16 | 0;
              return (c === 'x' ? r : (r & 3 | 8)).toString(16);
            }));
        LS.set(AVATAR_PREFIX + key, url);
        st.myAvatarKey = key;
        saveSettings(st);
        if (game) game.settings = st;
        renderSeats();
      };
      img.onerror = function () { alert('这张图片读不出来，换一张试试。'); };
      img.src = reader.result;
    };
    reader.onerror = function () { alert('读取文件失败。'); };
    reader.readAsDataURL(file);
  }

    var theta = (idx / n) * Math.PI * 2;
    el.style.left = (50 + rx * Math.sin(theta)) + '%';

  function rangeFor() {

  // 翻前给玩家的 GTO 建议：直接显示当前局面下这张牌的加注/跟注/弃牌频率
  function handAdvice() {
    if (!game || game.handOver || game.street !== 'preflop') return '';
    var me = game.players[0];
    if (!me || !me.hole || me.hole.length < 2) return '';
    var key = gtoSpot(game, 0);
    if (!key || !GTO || !GTO.spots[key]) {
      var t = rangeFor();
      return t ? (t + '｜此处无 GTO 表覆盖，先按牌力参考') : '';
    }
    var idx = GTO_IDX[holeKey(me.hole)];
    var f = idx === undefined ? null : parseGtoCode(GTO.spots[key][idx]);
    if (!f) return rangeFor() || '';
    if (game.players.length === 2) f = widenHU(f, gtoPos(0) === 'BTN');
    var parts = [];
    if (f.r >= 0.005) parts.push('加注 ' + Math.round(f.r * 100) + '%');
    if (f.c >= 0.005) parts.push('跟注 ' + Math.round(f.c * 100) + '%');
    if (f.a >= 0.005) parts.push('全下 ' + Math.round(f.a * 100) + '%');
    if (f.f >= 0.005) parts.push('弃牌 ' + Math.round(f.f * 100) + '%');
    var spotName = key.indexOf('rfi/') === 0
      ? ('开池 · ' + key.slice(4))
      : ('应对 · ' + key.slice(8));
    var tail = game.players.length === 2 ? '（单挑已放宽）' : '';
    return 'GTO｜' + spotName + '：' + parts.join(' / ') + tail;
  }

  function mkBtn(label, cls, fn, disabled) {

  function renderActions() {
    var box = $('actionButtons');
    box.innerHTML = '';
    $('oddsHint').textContent = '';

    if (game.handOver) {
      if (challenge && challenge.result) {
        $('actionHint').textContent = '挑战已结束';
        box.appendChild(mkBtn('查看结果', 'raise', function () { showResult(); }, false));
        return;
      }
      $('actionHint').textContent = '这一手结束了';
      box.appendChild(mkBtn('下一手', 'raise', function () { nextHand(); }));
      return;
    }
    if (game.activeSeat !== 0) {
      $('actionHint').textContent = busy ? '对手思考中…' : '等待对手行动…';
      return;
    }
    var me = game.players[0];
    var toCall = game.streetCurrentBet - me.streetBet;
    var acts = E.legalActionsFor(game, 0);
    var canRaise = acts.some(function (a) { return a.type === 'raise'; });
    var canAllin = acts.some(function (a) { return a.type === 'allin'; });

    $('actionHint').textContent = toCall > 0 ? ('要跟 ' + Math.min(toCall, me.chips)) : '可以过牌或下注';

    // 底池赔率提示
    if (toCall > 0) {
      var need = toCall / (game.pot + toCall);
      $('oddsHint').textContent = '跟注 ' + Math.min(toCall, me.chips) + '，跟注前底池 ' + game.pot +
        ' → 需要 ' + Math.round(need * 100) + '% 胜率';
    }

    box.appendChild(mkBtn('弃牌', 'fold', function () { doAct({ type: 'fold' }); }));
    if (toCall <= 0) {
      box.appendChild(mkBtn('过牌', 'check', function () { doAct({ type: 'check' }); }));
    } else {
      box.appendChild(mkBtn('跟注 ' + Math.min(toCall, me.chips), 'call', function () { doAct({ type: 'call' }); }));
    }

    if (canRaise) {
      var raiseAct = acts.filter(function (a) { return a.type === 'raise'; })[0];
      raiseValue = Math.min(Math.max(raiseValue, raiseAct.min), raiseAct.max);

      var panel = document.createElement('div');
      panel.className = 'raise-panel';

      var slider = document.createElement('input');
      slider.type = 'range';
      slider.min = raiseAct.min;
      slider.max = raiseAct.max;
      slider.step = 1;
      slider.value = raiseValue;

      var amt = document.createElement('span');
      amt.className = 'amt';
      amt.textContent = raiseValue;

      slider.oninput = function () { raiseValue = +slider.value; amt.textContent = raiseValue; };
      panel.appendChild(slider);
      panel.appendChild(amt);

      var raiseBtn = mkBtn('加注到 ' + raiseValue, 'raise', function () {
        doAct({ type: 'raise', amount: +slider.value });
      });
      raiseBtn._amt = amt;
      raiseBtn._upd = function () { raiseBtn.textContent = '加注到 ' + raiseValue; };
      slider.addEventListener('input', function () { raiseBtn._upd(); });
      box.appendChild(raiseBtn);
      box.appendChild(panel);
    }
    if (canAllin) {
      box.appendChild(mkBtn('全下 ' + (me.streetBet + me.chips), 'allin', function () { doAct({ type: 'allin' }); }));
    }
  }

  function pushMessage(seat, action) {
    var enabled = !game.settings || game.settings.messageEnabled !== false;
    if (!enabled || seat === 0) return;
    var key = action.type;
    var pool = MSG_POOL[key];
    if (!pool) return;
    var mind = AI_MIND[seat];
    var src = pool;
    if (mind && mind.tilt > 0.35 && Math.random() < 0.55) {
      src = MSG_TONE.tilt;
    } else if (_lastEq >= 0.68) {
      src = MSG_TONE.strong[key] || pool;
    } else if (_lastEq <= 0.42) {
      src = MSG_TONE.weak[key] || pool;
    }
    var text = src[Math.floor(Math.random() * src.length)];
    messages.push({
      id: 'msg-' + (messages.length + 1),
      speakerId: seat,
      actionIndex: game.actions.length - 1,
      type: 'action',
      text: text,
      createdAt: Date.now(),
      templateKey: key
    });
    showBubble(seat, text);
    maybeReply(seat, action);

  function say(seat, text, delay, speak) {

  // ---------------- AI ----------------
  // 两个互相独立的旋钮：

  var AI_PROFILE = {
    // 新手：不查 GTO 表、不看底池赔率、不认人、不估范围、见大注就怂；乱打率高、算得糙、尺度永远是老一套
    easy:   { name: '新手', mistake: 0.19, iters: 280,  blur: 0.52, noGto: true,  noOdds: true,  noRead: true,  noRange: true,  noMdf: true,  fixedSize: true,  scare: 0.42, plan: false },

  };

  // ---------------- 单手计划 ----------------
  // 每手只掷一次意图，整手按意图走。目的不是变强，是让行为「有故事」：

  var AI_PLAN = {};

  function planPos(g, seat) {
    var n = g.players.length;
    if (g.mode === 'hu') return seat === g.buttonSeat ? 'BTN' : 'BB';
    var off = (seat - g.buttonSeat + n) % n;
    var names = n >= 8
      ? ['BTN', 'SB', 'BB', 'UTG', 'UTG+1', 'MP', 'MP+1', 'HJ', 'CO']
      : ['BTN', 'SB', 'BB', 'UTG', 'MP', 'CO'];

  }

  var AI_STYLES = {

  var AI_MIND = {};

  function mindOf(seat) {

  // 每手抓一次筹码快照，用来算这手是赢是输
  function snapshotChips(g) {
    if (!g) return;

  }

  function updateMind(g) {
    if (!g || !g.actions || !g.actions.length) return;
    var acts = g.actions, seen = {}, vp = {}, pf = {};
    for (var i = 0; i < acts.length; i++) {
      var a = acts[i];
      // 行为画像对所有座位都记（包括真人座位 0）：面对下注弃不弃牌，是最有用的漏洞信号
      var ma = mindOf(a.playerId);
      if (a.toCallBefore > 0 && (a.type === 'fold' || a.type === 'call' || a.type === 'raise' || a.type === 'allin')) {
        ma.facedBet++;
        if (a.type === 'fold') ma.foldedToBet++;
        if (a.street === 'river') {
          ma.riverFaced++;
          if (a.type === 'fold') ma.riverFolded++;
        }
        // 分街漏洞：跟注站翻牌不弃、河牌却秒弃，是完全不同的两种对手
        if (a.street !== 'preflop' && ma.sFaced[a.street] !== undefined) {
          ma.sFaced[a.street]++;
          if (a.type === 'fold') ma.sFolded[a.street]++;

      var m = mindOf(a.playerId);
      if (a.street === 'preflop') {
        seen[a.playerId] = 1;
        if (a.type === 'call' || a.type === 'raise' || a.type === 'allin') vp[a.playerId] = 1;
        if (a.type === 'raise' || a.type === 'allin') pf[a.playerId] = 1;
      } else if (a.type === 'call' || a.type === 'raise' || a.type === 'allin') {
        m.postActs++;
        if (a.type === 'raise' || a.type === 'allin') m.aggActs++;
      }
    }
    Object.keys(seen).forEach(function (k) {
      var mm = mindOf(Number(k));
      mm.hands++;
      if (vp[k]) mm.vpipHands++;
      if (pf[k]) mm.pfrHands++;
    });
    // 情绪：输掉大池会 tilt（打得更松更凶），每手自然消退
    for (var s = 1; s < g.players.length; s++) {
      var md = mindOf(s);
      var before = _chipsAtHandStart[s];
      var after = g.players[s].chips;
      if (typeof before === 'number' && before > 0) {
        var lost = (before - after) / before;
        if (lost > 0.30) md.tilt = Math.min(1, md.tilt + 0.50);
        else if (lost > 0.14) md.tilt = Math.min(1, md.tilt + 0.24);
        else if (lost < -0.25) md.tilt = Math.max(0, md.tilt - 0.18);
      }

    // 你加注后老是摊出高牌 / 一对 → 以后你再加注他就少信；
    // 你从不拿弱牌加注 → 那他一见你加注就跑。这是真人高手最值钱的一项观察。
    var hero = g.players[0];

  // 读桌：看其他座位是松鱼多还是紧手多。样本不足 6 手不下结论，免得开局乱猜。
  function tableRead(seat) {
    var sum = 0, n = 0, loose = 0, tight = 0;
    if (!game || !game.players) return { n: 0, avgVpip: 0.35, loose: 0, tight: 0 };
    for (var s = 1; s < game.players.length; s++) {
      if (s === seat) continue;
      var m = AI_MIND[s];
      if (!m || m.hands < 6) continue;
      var v = m.vpipHands / m.hands;
      sum += v; n++;
      if (v > 0.50) loose++;
      if (v < 0.26) tight++;
    }
    return { n: n, avgVpip: n ? sum / n : 0.35, loose: loose, tight: tight };
  }

  // 剥削（伪作弊的核心）：不是偷看你的底牌，是把你的习惯记得比你自己还清楚。
  // 样本不足 6 次观测就不下结论，免得前几手就「读死」。
  function exploitOf(seat) {
    var m = AI_MIND[seat];
    if (!m || m.facedBet < 6) return null;
    var f = m.foldedToBet / m.facedBet;
    var rf = m.riverFaced >= 4 ? m.riverFolded / m.riverFaced : f;
    var out = { bluff: 1, value: 1, foldRate: f, riverFold: rf, n: m.facedBet, note: '', cheatLine: '', cheatStreet: null };

    // ① 总弃牌率：你爱弃牌就多诈唬，你不弃就少诈唬多收价值
    if (f > 0.55) { out.bluff *= 1.70; out.note = 'foldy'; }
    else if (f > 0.45) { out.bluff *= 1.25; out.note = 'foldy'; }
    if (f < 0.30) { out.bluff *= 0.45; out.value *= 1.22; out.note = 'station'; }

    // ② 河牌单点：河牌弃得比别处多，说明你只敢跟到转牌 → 河牌多开火
    if (rf > 0.62) { out.bluff *= 1.30; out.cheatLine = 'riverFold'; }

    var rs = m.raisedShowCats || [];

      for (i = 0; i < rs.length; i++) if (rs[i] <= 1) weak++;

      else if (wr < 0.12) { out.bluff *= 1.20; out.note = 'nuts'; out.cheatLine = 'nuts'; }
    }

      if (gap > worstGap) { worstGap = gap; worst = st; }

  // ---------------- GTO 翻前表 ----------------
  var GTO = (typeof window !== 'undefined') ? window.GTO_TABLE : null;
  var GTO_IDX = {};

  var RK13 = '23456789TJQKA';

  function holeKey(hole) {
    var a = Math.max(hole[0].r, hole[1].r);

    return RK13.charAt(a - 2) + RK13.charAt(b - 2) + (hole[0].s === hole[1].s ? 's' : 'o');
  }

  // 动作串：r raise / c call / a allin / f fold；空串 = 100% 弃牌
  function parseGtoCode(code) {
    var f = { r: 0, c: 0, a: 0, f: 0 };
    if (!code) { f.f = 1; return f; }
    var i = 0;
    while (i < code.length) {
      var ch = code.charAt(i++), num = '';
      while (i < code.length && /[0-9.]/.test(code.charAt(i))) num += code.charAt(i++);
      if (f[ch] === undefined) continue;
      f[ch] = num ? parseFloat(num) : 1;
    }
    var sum = f.r + f.c + f.a + f.f;
    if (sum > 0.001 && Math.abs(sum - 1) > 0.01) { f.r /= sum; f.c /= sum; f.a /= sum; f.f /= sum; }
    return f;
  }
