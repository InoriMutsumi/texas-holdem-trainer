  // ---------------- 导出 / 导入 ----------------
  function exportHands() {
    var data = {
      schemaVersion: 2,
      exportedAt: Date.now(),
      hands: loadHands(),
      notes: loadNotes()
    };
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'poker-hands-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {
      alert('导出失败：' + e.message);
    }
  }

  function importHands() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var data = JSON.parse(r.result);
          var incoming = Array.isArray(data) ? data : (data.hands || []);
          if (!Array.isArray(incoming)) throw new Error('文件里没有 hands 数组');
          var cur = LS.get('poker.hands.v2', []);
          var seen = {};
          cur.forEach(function (h) { seen[h.time + ':' + h.id] = true; });
          var added = 0;
          incoming.forEach(function (h) {
            if (!h || typeof h.time !== 'number') return;
            var k = h.time + ':' + h.id;
            if (seen[k]) return;
            cur.push(h);
            seen[k] = true;
            added++;
          });
          if (cur.length > 200) cur = cur.slice(cur.length - 200);
          LS.set('poker.hands.v2', cur);
          if (data.notes && typeof data.notes === 'object') {
            var n = loadNotes();
            var have = {};
            n.forEach(function (x) { have[x.handId] = true; });
            var incomingNotes = Array.isArray(data.notes)
              ? data.notes
              : Object.keys(data.notes).map(function (k) {
                  return { schemaVersion: 2, id: 'n' + k, text: String(data.notes[k]), handId: Number(k) };
                });
            incomingNotes.forEach(function (x) {
              if (!x || typeof x.handId !== 'number' || typeof x.text !== 'string') return;
              if (have[x.handId]) return;
              n.push({ schemaVersion: 2, id: x.id || ('n' + x.handId), text: x.text, handId: x.handId });
              have[x.handId] = true;
            });
            LS.set('poker.notes.v2', n);
          }
          alert('导入完成，新增 ' + added + ' 手。');
          showHistory();
        } catch (e) {
          alert('导入失败：' + e.message);
        }
      };
      r.readAsText(f);
    };
    inp.click();
  }

  function loadHands() {
    var hs = LS.get('poker.hands.v2', []);
    if (!Array.isArray(hs)) return [];
    return hs.map(function (h) {
      if (!h || typeof h !== 'object') return null;
      if (!Array.isArray(h.messages)) h.messages = [];
      if (!Array.isArray(h.sidePots)) h.sidePots = [];
      if (!Array.isArray(h.actions)) h.actions = [];
      if (h.review === undefined) h.review = null;
      return h;
    }).filter(Boolean);
  }

  function loadNotes() {
    var n = LS.get('poker.notes.v2', null);
    if (Array.isArray(n)) {
      return n.filter(function (x) { return x && typeof x.handId === 'number' && typeof x.text === 'string'; });
    }
    // 兼容早期「对象 map」写法
    if (n && typeof n === 'object') {
      return Object.keys(n).map(function (k) {
        return { schemaVersion: 2, id: 'n' + k, text: String(n[k]), handId: Number(k) };
      });
    }
    return [];
  }

  function noteFor(handId) {
    var n = loadNotes();
    for (var i = 0; i < n.length; i++) {
      if (n[i].handId === handId) return n[i].text;
    }
    return '';
  }

  function saveNote(handId, text) {
    var n = loadNotes();
    var t = String(text || '').trim();
    n = n.filter(function (x) { return x.handId !== handId; });
    if (t) {
      n.push({ schemaVersion: 2, id: 'n' + handId + '-' + Date.now().toString(36), text: t, handId: handId });
    }
    LS.set('poker.notes.v2', n);
  }

  var replayTimer = null;

  function setupReplay(h) {
    var acts = h.actions || [];
    var n = acts.length;
    var idx = -1;
    var nameOf = {};
    (h.players || []).forEach(function (p) { nameOf[p.id] = p.name; });

    function renderStep() {
      var a = (idx >= 0 && idx < n) ? acts[idx] : null;
      var board = a ? (a.board || []) : [];
      var bd = $('rvBoard');
      if (bd) bd.textContent = board.length ? board.map(E.cardStr).join(' ') : '（未发）';

      var bets = {};
      for (var i = 0; i <= idx && i < n; i++) {
        var x = acts[i];
        bets[x.playerId] = (x.amountBefore || 0) + (x.amountAdded || 0);
      }
      var pots = $('rvPots');
      if (pots) {
        pots.innerHTML = (h.players || []).map(function (p) {
          return '<span class="rv-pot-item' + (a && a.playerId === p.id ? ' now' : '') + '">' +
            p.name + ' <b>' + (bets[p.id] || 0) + '</b></span>';
        }).join('');
      }

      var list = $('rvList');
      if (list) {
        list.innerHTML = acts.map(function (x, i) {
          return '<div class="replay-line' + (i === idx ? ' now' : '') + '">' +
            '<span class="rp-street">' + (STREET_CN[x.street] || x.street) + '</span>' +
            '<span class="rp-who">' + (nameOf[x.playerId] || ('#' + x.playerId)) + '</span>' +
            '<span class="rp-act">' + (ACT_CN[x.type] || x.type) +
            (x.amountAdded ? ' ' + x.amountAdded : '') + '</span>' +
            '<span class="rp-pot">底池 ' + (x.potAfter || 0) + '</span>' +
            '</div>';
        }).join('');
        var cur = list.querySelector('.replay-line.now');
        if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
      }

      var step = $('rvStep');
      if (step) step.textContent = (idx + 1) + ' / ' + n;
      if ($('rvPrev')) $('rvPrev').disabled = idx < 0;
      if ($('rvFirst')) $('rvFirst').disabled = idx < 0;
      if ($('rvNext')) $('rvNext').disabled = idx >= n - 1;
      if ($('rvLast')) $('rvLast').disabled = idx >= n - 1;
    }

    function stop() {
      if (replayTimer) { clearInterval(replayTimer); replayTimer = null; }
      if ($('rvPlay')) $('rvPlay').textContent = '▶ 播放';
    }

    if ($('rvFirst')) $('rvFirst').onclick = function () { stop(); idx = -1; renderStep(); };
    if ($('rvPrev')) $('rvPrev').onclick = function () { stop(); idx = Math.max(-1, idx - 1); renderStep(); };
    if ($('rvNext')) $('rvNext').onclick = function () { stop(); idx = Math.min(n - 1, idx + 1); renderStep(); };
    if ($('rvLast')) $('rvLast').onclick = function () { stop(); idx = n - 1; renderStep(); };
    if ($('rvPlay')) {
      $('rvPlay').onclick = function () {
        if (replayTimer) { stop(); return; }
        if (idx >= n - 1) idx = -1;
        $('rvPlay').textContent = '⏸ 暂停';
        replayTimer = setInterval(function () {
          if (idx >= n - 1) { stop(); return; }
          idx++;
          renderStep();
        }, 700);
      };
    }
    renderStep();
    return {
      goto: function (i) {
        stop();
        idx = Math.max(-1, Math.min(n - 1, i));
        renderStep();
      }
    };
  }

  // ---------------- 启动 ----------------
  function showSettings() {
    var s = loadSettings();
    var html = '<h3>设置</h3>';
    html += '<div class="row"><span>小盲</span><span>' +
      '<input id="setSb" class="num-input" type="number" min="1" step="1" value="' + s.blinds.sb + '"></span></div>';
    html += '<div class="row"><span>大盲</span><span>' +
      '<input id="setBb" class="num-input" type="number" min="2" step="1" value="' + s.blinds.bb + '"></span></div>';
    html += '<div class="note">改盲注会重开一局，本场手数与筹码保留。大盲不能小于小盲。</div>';
    html += '<div class="actions">' +
      '<button class="btn fold" id="btnCancelSet">取消</button>' +
      '<button class="btn check" id="btnSaveSet">保存并重开</button></div>';
    openModal(html);
    $('btnCancelSet').onclick = closeModal;
    $('btnSaveSet').onclick = function () {
      var sb = Math.max(1, parseInt($('setSb').value, 10) || 10);
      var bb = Math.max(sb, parseInt($('setBb').value, 10) || sb * 2);
      var st = loadSettings();
      st.blinds = { sb: sb, bb: bb };
      saveSettings(st);
      closeModal();
      newGame();
    };
  }

  function switchTable(mode) {
    var s = loadSettings();
    if (game) {
      s.chips = game.players[0].chips;
      s.hands = game.handsPlayed;
      s.rebuys = game.rebuys;
    }
    s.table = mode;
    saveSettings(s);
    newGame();
  }

  Array.prototype.forEach.call($('modeSeg').children, function (b) {
    b.onclick = function () {
      var mode = b.getAttribute('data-mode');
      if (mode === loadSettings().table) return;
      switchTable(mode);
    };
  });

  $('aiLevelSel').onchange = function () {
    var s = loadSettings();
    s.aiLevel = this.value;
    saveSettings(s);
    if (game) game.aiLevel = this.value;
  };

  $('msgToggle').onchange = function () {
    var s = loadSettings();
    s.messageEnabled = this.checked;
    saveSettings(s);
    if (game) {
      game.settings = game.settings || {};
      game.settings.messageEnabled = this.checked;
    }
  };

  $('btnRestart').onclick = function () {
    if (!confirm('重开一局？当前筹码会重置为 2000。')) return;
    var s = loadSettings();
    LS.set('poker.save.v2', {
      schemaVersion: 2, chips: 2000, hands: 0, rebuys: 0,
      settings: {
        table: s.table, aiLevel: s.aiLevel, blinds: { sb: 10, bb: 20 },
        buyIn: 2000, autoRebuy: true, messageEnabled: s.messageEnabled, avatars: []
      },
      stats: { vpip: 0, pfr: 0, won: 0, ev: 0 }
    });
    newGame();
  };
  $('btnHistory').onclick = showHistory;
  $('btnStats').onclick = showStats;
  $('btnSettings').onclick = showSettings;
  $('btnGuide').onclick = function () { showGuide(); };
  $('overlay').onclick = function (e) { if (e.target === $('overlay')) closeModal(); };

  // 调试/截图用：?auto=N 自动随机行动打完 N 手（正常打开不受影响）
  function startAutoPlay() {
    var m = String(location.search || '').match(/[?&]auto=(\d+)/);
    if (!m) return;
    var target = +m[1];
    var timer = setInterval(function () {
      if (!game) return;
      if (game.handsPlayed >= target) {
        // 等这一手的结算弹层真的出来，再切去牌谱，避免被 showResult 覆盖
        if (!$('overlay').classList.contains('show')) return;
        clearInterval(timer);
        if (/[?&]stats=1/.test(location.search)) { setTimeout(showStats, 400); return; }
        if (/[?&]hist=1/.test(location.search)) {
          setTimeout(function () {
            var hs = LS.get('poker.hands.v2', []);
            if (/[?&]hand=1/.test(location.search) && hs.length) showHandDetail(hs[0]);
            else showHistory();
          }, 400);
        }
        return;
      }
      if ($('overlay').classList.contains('show')) {
        if ($('btnNextHand')) $('btnNextHand').click();
        return;
      }
      var btns = $('actionButtons').children;
      for (var i = 0; i < btns.length; i++) {
        if (btns[i].tagName === 'BUTTON' && !btns[i].disabled) { btns[i].click(); return; }
      }
    }, 350);
  }

  newGame();
  startAutoPlay();
  if (/[?&]avatar=1/.test(location.search)) setTimeout(pickAvatar, 600);
  var gm = String(location.search || '').match(/[?&]guide=(\w+)/);
  if (gm) setTimeout(function () { showGuide(gm[1]); }, 600);

  // 键盘操作：1 弃牌 / 2 跟注或过牌 / 3 加注 / 4 全下 / Esc 关弹层
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
    if ($('overlay').classList.contains('show')) {
      if (e.key === 'Escape') { closeModal(); e.preventDefault(); }
      return;
    }
    var map = { '1': 0, f: 0, '2': 1, c: 1, '3': 2, r: 2, '4': 3, a: 3 };
    var i = map[e.key];
    if (i === undefined) return;
    var btns = $('actionButtons').children;
    if (btns[i] && btns[i].tagName === 'BUTTON' && !btns[i].disabled) {
      btns[i].click();
      e.preventDefault();
    }
  });
})();
</script>
</body>
</html>
